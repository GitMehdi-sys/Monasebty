name: Code health report
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: ESLint
        run: npx eslint . -f json -o eslint.json || true

      - name: npm audit
        run: npm audit --json > audit.json || true

      - name: Create or update issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = f => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch { return null; } };

            const eslint = read('eslint.json') || [];
            const audit = read('audit.json');

            const lintFiles = eslint.filter(f => f.errorCount + f.warningCount > 0);
            const errors = lintFiles.reduce((n, f) => n + f.errorCount, 0);
            const warnings = lintFiles.reduce((n, f) => n + f.warningCount, 0);

            let body = `## Automated code health report\n\n`;
            body += `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;

            body += `### Code issues (ESLint)\n${errors} errors, ${warnings} warnings\n\n`;
            for (const f of lintFiles.slice(0, 15)) {
              const rel = f.filePath.replace(process.env.GITHUB_WORKSPACE + '/', '');
              body += `**${rel}**\n`;
              for (const m of f.messages.slice(0, 5)) {
                body += `- line ${m.line}: ${m.message} (\`${m.ruleId}\`)\n`;
              }
              body += `\n`;
            }

            body += `### Vulnerable dependencies (npm audit)\n`;
            const vulns = audit?.vulnerabilities ? Object.entries(audit.vulnerabilities) : [];
            if (!vulns.length) body += `None found.\n`;
            for (const [name, v] of vulns.slice(0, 20)) {
              body += `- **${name}**: ${v.severity}, fix available: ${v.fixAvailable ? 'yes' : 'no'}\n`;
            }

            const title = 'Automated code health report';
            const { data: existing } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'automated-scan'
            });

            if (errors + warnings + vulns.length === 0) {
              if (existing[0]) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing[0].number, state: 'closed' });
              }
              return;
            }

            if (existing[0]) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['automated-scan'] });
            }
